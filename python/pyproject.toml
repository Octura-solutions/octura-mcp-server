[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "octura-mcp-server"
version = "1.0.0"
description = "stdio bridge to the Octura Solutions MCP server: 24 deterministic Odoo ERP calculators"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = ["mcp", "model-context-protocol", "odoo", "erp", "calculator", "roi", "sales-tax"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Office/Business :: Financial",
]
# No dependencies, on purpose: the bridge runs on the standard library, so
# there is nothing that can break an install.
dependencies = []

[project.urls]
Homepage = "https://octurasolutions.com/tools/mcp-server"
Repository = "https://github.com/Octura-solutions/octura-mcp-server"

[project.scripts]
octura-mcp-server = "octura_mcp_server.bridge:main"

[tool.hatch.build.targets.wheel]
packages = ["octura_mcp_server"]
